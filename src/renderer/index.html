<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ProjectOS</title><link rel="stylesheet" href="style.css?v=github-device-flow-1">
</head>
<body>
<div id="kinetic-grid" aria-hidden="true"></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">P</div><div><b>PROJECTOS</b><small>The creator OS</small></div></div>
    <nav>
      <button class="nav active" data-view="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav" data-view="projects">▣ <span>Projects</span></button>
      <button class="nav" data-view="tasks">✓ <span>Tasks</span></button>
      <button class="nav" data-view="ideas">✦ <span>Idea Vault</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="storage"><span>Workspace</span><strong>Local</strong><div class="bar"><i></i></div></div><button class="nav" id="settingsButton">⚙ <span>Settings</span></button></div>
  </aside>
  <main><header><div><div class="eyebrow">YOUR WORKSPACE</div><h1 id="title">Dashboard</h1></div><div class="header-actions"><button class="icon">⌕</button><button class="avatar">JE</button></div></header><section id="content"></section></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><h2 id="modalTitle">New project</h2><input id="nameInput" placeholder="Project name"><textarea id="descInput" placeholder="What are you building?"></textarea><button class="primary" id="saveModal">Create</button></div></div>
<script src="github-auth.js?v=github-device-flow-1"></script>
<script src="app.js?v=github-device-flow-1"></script>
</body></html>
