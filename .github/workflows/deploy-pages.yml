name: Deploy ProjectOS Web Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare, cache-bust, and verify web preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R src/renderer/. _site/
          # Give every deployment a unique asset URL so stale Pages/CDN assets cannot win.
          sed -i "s/style\.css?v=kinetic-2/style.css?v=$GITHUB_SHA/g" _site/index.html
          sed -i "s/app\.js?v=kinetic-2/app.js?v=$GITHUB_SHA/g" _site/index.html
          printf '\n<!-- ProjectOS deployment: %s -->\n' "$GITHUB_SHA" >> _site/index.html
          test -f _site/index.html
          grep -q "$GITHUB_SHA" _site/index.html
          grep -q 'style.css?v=' _site/index.html
          grep -q 'app.js?v=' _site/index.html
          grep -q 'kinetic-grid' _site/index.html
          echo "Verified renderer, unique asset URLs, and Kinetic Grid."
          echo "Deploying commit: $GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
